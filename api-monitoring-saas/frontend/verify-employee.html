<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verify your employee invitation and get your login credentials.">
    <title>Verify Employee — API Monitor</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
    <style>
        .verify-page {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .verify-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
            backdrop-filter: blur(20px);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }

        .verify-header {
            background: var(--accent-gradient);
            padding: 32px;
            text-align: center;
        }

        .verify-header h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 6px;
        }

        .verify-header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
        }

        .verify-body {
            padding: 36px;
        }

        .verify-status {
            text-align: center;
            padding: 20px 0;
        }

        .verify-status .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .verify-status h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .verify-status p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .credentials-box {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-top: 24px;
        }

        .credentials-box h3 {
            font-size: 1rem;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .credential-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .credential-row:last-child {
            border-bottom: none;
        }

        .credential-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .credential-value {
            font-family: 'Courier New', monospace;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-secondary);
            background: rgba(6, 182, 212, 0.1);
            padding: 6px 14px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            user-select: all;
            cursor: pointer;
        }

        .credential-value:hover {
            background: rgba(6, 182, 212, 0.2);
        }

        .copy-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 12px;
        }

        .warning-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--warning);
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
        }

        .error-text {
            color: var(--danger);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="verify-page">
            <div class="verify-card">
                <div class="verify-header">
                    <h1>📡 API Monitor</h1>
                    <p>Employee Verification</p>
                </div>
                <div class="verify-body" id="verify-body">
                    <div class="verify-status" id="verify-loading">
                        <div class="icon">🔄</div>
                        <h2>Verifying your invitation...</h2>
                        <p>Please wait while we process your verification.</p>
                        <div class="spinner" style="margin: 20px auto;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const API_VERIFY_BASE = (window.location.protocol === 'file:' || window.location.origin === 'null')
            ? 'http://localhost:5000'
            : window.location.origin;

        async function verifyEmployee() {
            const body = document.getElementById('verify-body');
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                body.innerHTML = `
                    <div class="verify-status">
                        <div class="icon">❌</div>
                        <h2 class="error-text">Invalid Link</h2>
                        <p>This verification link is missing the required token. Please check your email and try again.</p>
                        <div class="login-link">
                            <a href="index.html" class="btn btn-primary" style="margin-top:16px;">Go to Login</a>
                        </div>
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(`${API_VERIFY_BASE}/api/auth/verify-employee`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                });

                const data = await response.json();

                if (!response.ok) {
                    body.innerHTML = `
                        <div class="verify-status">
                            <div class="icon">${response.status === 410 ? '⚠️' : '❌'}</div>
                            <h2 class="error-text">${response.status === 410 ? 'Already Verified' : 'Verification Failed'}</h2>
                            <p>${data.error || 'Something went wrong. Please contact your company administrator.'}</p>
                            <div class="login-link">
                                <a href="index.html" class="btn btn-primary" style="margin-top:16px;">Go to Login</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                // Success — show credentials
                body.innerHTML = `
                    <div class="verify-status">
                        <div class="icon">✅</div>
                        <h2>Welcome, ${escapeHtml(data.name)}!</h2>
                        <p>Your account has been created. Use the credentials below to log in.</p>
                    </div>
                    <div class="credentials-box">
                        <h3>🔑 Your Login Credentials</h3>
                        <div class="credential-row">
                            <span class="credential-label">Employee ID</span>
                            <span class="credential-value" id="cred-id" title="Click to copy">${escapeHtml(data.employee_id)}</span>
                        </div>
                        <div class="credential-row">
                            <span class="credential-label">Password</span>
                            <span class="credential-value" id="cred-pw" title="Click to copy">${escapeHtml(data.password)}</span>
                        </div>
                        <p class="copy-hint">Click on a value to copy it</p>
                    </div>
                    <div class="warning-box">
                        <span>⚠️</span>
                        <span><strong>Save these credentials!</strong> This page will only show them once. For security, the password cannot be retrieved later.</span>
                    </div>
                    <div class="login-link">
                        <a href="index.html" class="btn btn-primary" style="margin-top:16px;">Go to Login →</a>
                    </div>
                `;

                // Copy on click
                document.getElementById('cred-id').addEventListener('click', function () {
                    navigator.clipboard.writeText(this.textContent);
                    showToast('Employee ID copied!');
                });
                document.getElementById('cred-pw').addEventListener('click', function () {
                    navigator.clipboard.writeText(this.textContent);
                    showToast('Password copied!');
                });

            } catch (error) {
                body.innerHTML = `
                    <div class="verify-status">
                        <div class="icon">❌</div>
                        <h2 class="error-text">Connection Error</h2>
                        <p>Could not reach the server. Please make sure the API Monitor backend is running.</p>
                        <div class="login-link">
                            <a href="index.html" class="btn btn-primary" style="margin-top:16px;">Go to Login</a>
                        </div>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', verifyEmployee);
    </script>
</body>

</html>
