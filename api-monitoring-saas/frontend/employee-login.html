<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Monitor — Entity Access Terminal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Synapse Styles -->
    <link rel="stylesheet" href="css/synapse.css">
    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 1.5rem; 
            overflow: hidden; 
            background: #030303;
        }

        .auth-container { 
            width: 100%; 
            max-width: 480px; 
            position: relative; 
            z-index: 10; 
            animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card { 
            padding: 2.5rem; 
            background: rgba(10, 10, 10, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 28px; 
            backdrop-filter: blur(30px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        
        .auth-logo { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 2rem; 
        }
        
        .logo-dot { 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            background: conic-gradient(from 180deg, var(--cyan), var(--violet), var(--cyan));
            box-shadow: 0 0 20px var(--cyan-glow);
            animation: rotateGlow 4s linear infinite;
        }
        
        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .auth-title {
            font-family: 'Instrument Serif', serif;
            font-size: 2.5rem;
            color: #fff;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .info-panel {
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.15);
            border-radius: 14px;
            padding: 1rem;
            margin-bottom: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            line-height: 1.5;
        }
        
        .info-panel i { color: var(--cyan); margin-top: 2px; }

        .form-group { margin-bottom: 1.25rem; position: relative; }
        .form-group label { 
            display: block; 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            letter-spacing: 0.15em; 
            color: var(--text-dim); 
            margin-bottom: 0.6rem; 
            font-weight: 800; 
        }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { 
            position: absolute; 
            left: 1.25rem; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--text-dim); 
            font-size: 0.9rem; 
            transition: color 0.3s;
        }
        
        .form-control { 
            width: 100%; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 14px; 
            padding: 1.1rem 1rem 1.1rem 3.2rem; 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.95rem;
            transition: all 0.3s; 
        }
        
        .form-control:focus { 
            border-color: var(--cyan); 
            background: rgba(255, 255, 255, 0.05); 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
        }
        
        .form-control:focus + i { color: var(--cyan); }

        .back-nav {
            position: absolute;
            top: -3.5rem;
            left: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .back-nav:hover { color: #fff; }
        
        .footer-link {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        
        .footer-link a {
            color: var(--violet);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .footer-link a:hover { color: var(--text); }

        .btn-submit {
            width: 100%;
            border: none;
            background: var(--cyan);
            color: #000;
            padding: 1.1rem;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px var(--cyan-glow);
        }
        
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px var(--cyan-glow); background: #22d3ee; }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body data-page="auth">
    <!-- Ambient Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="auth-container">
        <a href="index.html" class="back-nav"><i class="fa-solid fa-arrow-left"></i> RETURN TO HUB</a>

        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-dot"></div>
                <div style="font-family: 'Instrument Serif', serif; font-size: 1.2rem; color: #fff;">Synapse Portal</div>
            </div>

            <h1 class="auth-title">Entity Access</h1>
            <p class="auth-subtitle">Synchronize with company resources</p>

            <div class="info-panel">
                <i class="fa-solid fa-circle-info"></i>
                <span>Enter your assigned <strong>Designation</strong>, <strong>Email</strong>, and <strong>Access Key</strong> provided by your administrator.</span>
            </div>

            <form id="employee-login-form">
                <div class="form-group">
                    <label>Designation (Name)</label>
                    <div class="input-wrapper">
                        <input type="text" id="emp-name" class="form-control" placeholder="Entity Name" required>
                        <i class="fa-solid fa-id-badge"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Vector</label>
                    <div class="input-wrapper">
                        <input type="email" id="emp-email" class="form-control" placeholder="operative@company.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>Access Key (Password)</label>
                    <div class="input-wrapper">
                        <input type="password" id="emp-password" class="form-control" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    ESTABLISH LINK <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <p class="footer-link">
            Are you a Company Administrator? <a href="login.html">Access Command Center</a>
        </p>
    </div>

    <script src="js/app.js"></script>
    <script src="js/synapse.js"></script>
    <script>
        document.getElementById('employee-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> SYNCING...';
            
            try {
                const d = await apiRequest('/api/auth/login', {
                    method: 'POST',
                    body: {
                        name: document.getElementById('emp-name').value.trim(),
                        email: document.getElementById('emp-email').value.trim(),
                        password: document.getElementById('emp-password').value,
                        login_type: 'employee'
                    }
                });
                saveAuth(d.token, d.user);
                showToast('Entity Synchronized');
                setTimeout(() => window.location.href = 'dashboard.html', 800);
            } catch(err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        if (typeof isAuthenticated === 'function' && isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
